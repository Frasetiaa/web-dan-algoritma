<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Jadwal Piket & Nginap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Sistem Jadwal Piket & Nginap</h1>

    
        <div class="form-group" style="margin-top: 15px;">
            <label for="cfg-daftar-nama">Daftar Nama Anggota (Satu nama per baris):</label>
            <textarea id="cfg-daftar-nama" rows="6" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; resize: vertical;">
Baihaqi
Haydar
Sultan
Mirza
Gibran
Roket
Ikhsan
Ridho
Hakim
Lutfi
Rafly
Fras
Dimas
Yoga
Kausar</textarea>
        </div>

        <div class="stats-summary">
            <span>Total Slot Piket: <span id="stat-piket">30</span></span>
            <span>Total Slot Nginap: <span id="stat-nginap">30</span></span>
            <span>Total Tugas: <span id="stat-total">60</span></span>
        </div>

       
    </div>

    <!-- Tampilan Kalender -->
    <div class="card">
        <h2>Jadwal Piket & Nginap</h2>
        <div id="calendar" class="calendar-grid"></div>
    </div>


</div>

<script src="script.js"></script>
</body>
</html>
