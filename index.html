<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Jadwal Piket & Nginap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Sistem Jadwal Piket & Nginap</h1>

    <!-- Konfigurasi Sistem -->
    <div class="card">
        <h2>Konfigurasi Sistem</h2>
        <div class="grid-config">
            <div class="form-group">
                <label>Tahun</label>
                <input type="number" id="cfg-tahun" value="2026">
            </div>
            <div class="form-group">
                <label>Bulan (1-12)</label>
                <input type="number" id="cfg-bulan" value="9" min="1" max="12">
            </div>
            <div class="form-group">
                <label>Jumlah Hari</label>
                <input type="number" id="cfg-hari" value="30">
            </div>
            <div class="form-group">
                <label>Jumlah Anggota</label>
                <input type="number" id="cfg-anggota" value="15">
            </div>
            <div class="form-group">
                <label>Piket / Hari</label>
                <input type="number" id="cfg-piket-hari" value="3">
            </div>
            <div class="form-group">
                <label>Nginap / Hari</label>
                <input type="number" id="cfg-nginap-hari" value="2">
            </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label for="cfg-daftar-nama">Daftar Nama Anggota (Satu nama per baris):</label>
            <textarea id="cfg-daftar-nama" rows="6" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; resize: vertical;">
Baihaqi
Haydar
Sultan
Mirza
Gibran
Roket
Ikhsan
Ridho
Hakim
Lutfi
Rafly
Fras
Dimas
Yoga
Kausar</textarea>
        </div>

        <div class="stats-summary">
            <span>Total Slot Piket: <span id="stat-piket">90</span></span>
            <span>Total Slot Nginap: <span id="stat-nginap">60</span></span>
            <span>Total Tugas: <span id="stat-total">150</span></span>
        </div>

        <div style="margin-top: 15px;">
            <button class="btn" onclick="generateSchedule()">Generate Jadwal Otomatis</button>
        </div>
    </div>

    <!-- Tampilan Kalender & Editor -->
    <div class="card">
        <h2>Jadwal Piket & Nginap</h2>
        <div id="calendar" class="calendar-grid"></div>
    </div>

    <!-- Ringkasan Pembagian Tugas -->
    <div class="card">
        <h2>Ringkasan Beban Kerja Anggota</h2>
        <table>
            <thead>
                <tr>
                    <th>Anggota</th>
                    <th>Total Piket</th>
                    <th>Total Nginap</th>
                    <th>Total Tugas</th>
                </tr>
            </thead>
            <tbody id="summary-table"></tbody>
        </table>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
